<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review | Crazy Daves</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --accent: #d4431e; --dark: #0d0d0f; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: var(--dark); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
  .card { background: #161618; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 48px 40px; max-width: 520px; width: 100%; text-align: center; }
  .logo { font-family: 'Oswald', sans-serif; font-size: 1.4rem; font-weight: 700; color: #fff; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 32px; }
  .logo span { color: var(--accent); }
  h2 { font-family: 'Oswald', sans-serif; font-size: 1.8rem; font-weight: 700; text-transform: uppercase; color: #fff; margin-bottom: 10px; }
  p { color: rgba(255,255,255,0.5); font-size: 0.95rem; line-height: 1.6; margin-bottom: 32px; }
  .stars { display: flex; justify-content: center; gap: 10px; margin-bottom: 36px; }
  .star { font-size: 2.8rem; cursor: pointer; color: rgba(255,255,255,0.15); transition: color 0.2s, transform 0.2s; }
  .star:hover, .star.active { color: #f5a623; transform: scale(1.15); }
  .cta-btn { display: block; background: var(--accent); color: white; padding: 15px 28px; border-radius: 8px; font-family: 'Oswald', sans-serif; font-size: 1rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin: 10px auto; transition: background 0.2s, transform 0.2s; max-width: 300px; }
  .cta-btn:hover { background: #e8643e; transform: translateY(-2px); }
  .back { display: inline-block; margin-top: 24px; color: rgba(255,255,255,0.3); font-size: 0.85rem; text-decoration: none; transition: color 0.2s; }
  .back:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Crazy <span>Daves</span></div>
  <h2>Rate Your Experience</h2>
  <p>Tap the stars below to rate us. We love hearing from our customers — every bit of feedback helps.</p>
  <div class="stars" id="stars">
    <span class="star" data-val="1">&#9733;</span>
    <span class="star" data-val="2">&#9733;</span>
    <span class="star" data-val="3">&#9733;</span>
    <span class="star" data-val="4">&#9733;</span>
    <span class="star" data-val="5">&#9733;</span>
  </div>
  <div id="cta-area"></div>
  <a href="index.html" class="back">&#8592; Back to website</a>
</div>
<script>
  const stars = document.querySelectorAll('.star');
  const ctaArea = document.getElementById('cta-area');
  stars.forEach(s => {
    s.addEventListener('click', () => {
      const val = parseInt(s.dataset.val);
      stars.forEach((st, i) => st.classList.toggle('active', i < val));
      if (val <= 3) {
        ctaArea.innerHTML = '<a href="private.html?rating=' + val + '" class="cta-btn">Share Your Feedback</a>';
      } else {
        ctaArea.innerHTML = '<a href="https://g.page/r/review" target="_blank" class="cta-btn">Leave a Google Review &#8594;</a>';
      }
    });
  });
</script>
</body>
</html>
